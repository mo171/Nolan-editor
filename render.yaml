services:
  - type: web
    name: nolan-studio-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: NOLAN_PRELOAD_MODELS
        value: "0"
      - key: UVICORN_RELOAD
        value: "0"
      - key: SPACY_ALLOW_BLANK_FALLBACK
        value: "1"
